name: Feature request
description: Suggest something gitaway could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, rather than the solution. For example, "I reach my git server through an OpenVPN server".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine gitaway could handle it.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Workarounds or other tools you've tried.
