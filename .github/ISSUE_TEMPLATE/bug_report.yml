name: Bug report
description: Something in gitaway doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Before you paste anything, remove private details.** Never paste a WireGuard `PrivateKey` line or a whole config file. Replace your real addresses, hostnames and usernames with examples such as `192.0.2.10`, `vpn.example.net` and `alice`.

        Security problems go to [private vulnerability reporting](https://github.com/nikkel/gitaway/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran and what gitaway printed. `gitaway check <profile>` output often shows which part failed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      options:
        - At home, on the same network as the git server
        - Away from home
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gitaway version
      description: The output of `gitaway --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: The output of `git --version`.
  - type: input
    id: server
    attributes:
      label: VPN and git server
      description: What runs them, for example "wg-quick on a NAS, Forgejo in Docker".
  - type: checkboxes
    id: private
    attributes:
      label: Privacy
      options:
        - label: I've removed private keys, real addresses and hostnames from this report.
          required: true
