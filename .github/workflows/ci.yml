name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Package builds generate the man pages, so make sure that works.
      - run: cargo test -p xtask
      - run: cargo xtask man

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # Windows is best-effort: failures are visible but don't block.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo test --all-targets

  # gitaway runs the user's own git, so the tests run against the oldest
  # supported git and against Apple's git, not just the runner's latest.
  git-versions:
    name: git ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported git: 2.34, as shipped by Ubuntu 22.04.
          - name: minimum
            os: ubuntu-latest
            container: ubuntu:22.04
          # macOS's own /usr/bin/git, which the runner's Homebrew git hides.
          - name: apple
            os: macos-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install build tools and git
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git openssh-client
      - name: Use Apple git
        if: matrix.name == 'apple'
        run: echo /usr/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo test --all-targets

  # Keeps the MSRV badge honest: the crate must build on rust-version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
