name: Audit

# Known vulnerabilities in dependencies: daily, so a new advisory is caught
# even when nothing here changes, and whenever the dependencies change.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job; "unmaintained" notices are only shown.
      - run: cargo audit
