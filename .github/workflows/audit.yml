name: Audit

# Known vulnerabilities in dependencies: daily, so a new advisory is caught
# even when nothing here changes, and whenever the dependencies change.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .cargo/audit.toml, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job; "unmaintained" notices are only shown.
      - run: cargo audit
