[workspace]
members = ["cargo:."]

# Config for 'dist'. After editing, run `dist generate` and commit the
# regenerated .github/workflows/release.yml: CI fails if they disagree.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
hosting = "github"
# Pull requests only check the plan: building them would also attest them,
# and an attested pull request build passes `gh attestation verify --repo`.
# Releases build without a cache, so nothing from an earlier run can end up
# in a published binary.
pr-run-mode = "plan"
cache-builds = false
# Linux builds are static (musl), so one archive runs on any distribution.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell"]
# Each archive gets a SHA-256 file, which the shell installer checks (the
# PowerShell one doesn't). GitHub records which workflow built every file:
# verify with `gh attestation verify <file> --repo nikkel/gitaway
# --source-ref refs/tags/<tag>`.
checksum = "sha256"
github-attestations = true
# Install where user programs go, not into ~/.cargo/bin, which `cargo install`
# manages and which people without Rust don't have.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Man pages are generated by a build step (see release-build-setup.yml).
include = ["dist-man"]
github-build-setup = "release-build-setup.yml"
# `git away push` needs a program called git-away.
[dist.bin-aliases]
gitaway = ["git-away"]

# One real binary on Linux and macOS; installers add the git-away link.
# Windows keeps two copies (hard links can't live in a zip).
[dist.binaries]
aarch64-apple-darwin = ["gitaway"]
x86_64-apple-darwin = ["gitaway"]
aarch64-unknown-linux-musl = ["gitaway"]
x86_64-unknown-linux-musl = ["gitaway"]

# The release workflow can write to the repository, so its actions are pinned
# to exact commits instead of moving tags.
[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
