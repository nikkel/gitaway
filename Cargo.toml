[package]
name = "gitaway"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Reach your self-hosted git server from anywhere, with a tunnel only gitaway uses"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikkel/gitaway"
readme = "README.md"
keywords = ["git", "wireguard", "self-hosted", "forgejo", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "1.2.1"
toml_edit = "0.25.19"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
